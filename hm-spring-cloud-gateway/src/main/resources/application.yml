server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:

          routes:
            - id: auth-service
              uri: lb://hm-auth-service
              predicates:
                - Path=/fosys/auth/**,/validate-token
              metadata:
                response-timeout: 5000
                connect-timeout: 2000

            - id: onboarding-service
              uri: lb://hm-onboarding-service
              predicates:
                - Path=/fosys/onboard/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 10MB
              metadata:
                response-timeout: 10000
                connect-timeout: 2000

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Correlation-Id
                exposedHeaders:
                  - X-Correlation-Id
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: read-only

logging:
  level:
    root: INFO
    com.harish.gateway: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: WARN